name: NOAA Reflectivity and HRRR Wind Update
on:
  workflow_dispatch:
  schedule:
    # Off-hour, quarter-hour cadence to reduce GitHub scheduler congestion.
    # GitHub scheduled Actions are best-effort and may still be delayed or skipped.
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: cu-noaa-forecast
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GRIB decoder and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev
          python -m pip install requests numpy eccodes
      - name: Refresh GFS every 3 hours (retain previous output on failure)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          if [ $((10#$(date -u +%H) % 3)) -eq 0 ] && [ "$(date -u +%M)" -lt "20" ]; then python scripts/update_reflectivity.py; else echo "GFS skipped (3-hour cadence)"; fi
      - name: Refresh HRRR incrementally (latest REFC first)
        run: python scripts/update_hrrr.py
      - name: Refresh RRFS independently (non-blocking)
        run: python scripts/update_rrfs.py || echo 'RRFS unavailable; preserving HRRR/GFS'
      - name: Refresh GFS and NAM wind samples (non-blocking)
        run: python scripts/update_model_winds.py || echo 'GFS/NAM wind sampling unavailable; retaining previous data'
      - name: Validate combined numerical reflectivity (report degraded data without blocking publication)
        run: |
          python - <<'PYVALID'
          import json, os
          from pathlib import Path
          problems = []
          counts = {}
          try:
              rows = json.loads(Path('reflectivity.json').read_text())
              if not isinstance(rows, list):
                  raise ValueError('reflectivity.json must contain an array')
              counts = {m: sum(isinstance(r, dict) and r.get('model') == m for r in rows) for m in ('gfs', 'hrrr')}
              for model, minimum in (('gfs', 8), ('hrrr', 4)):
                  if counts[model] < minimum:
                      problems.append(f'{model.upper()}: only {counts[model]} records (minimum {minimum})')
                  bad = [r for r in rows if isinstance(r, dict) and r.get('model') == model and
                         (not isinstance(r.get('zones'), dict) or not isinstance(r.get('peak'), dict))]
                  if bad:
                      problems.append(f'{model.upper()}: {len(bad)} records missing geographic fields')
          except Exception as exc:
              problems.append(f'Reflectivity unavailable or invalid: {exc}')
          print('Reflectivity record counts:', counts)
          if problems:
              for problem in problems:
                  print('::warning::' + problem)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('### Reflectivity validation warnings\\n' + ''.join('- ' + p + '\\n' for p in problems))
          else:
              print('Validated combined reflectivity')
          PYVALID
      - name: Summarize model freshness and progress
        if: always()
        run: |
          python - <<'PYSUM'
          import json, os
          from pathlib import Path
          lines = ["## NOAA model update status", "", "| Model | Cycle (UTC) | Updated (UTC) | Progress | Errors |", "|---|---|---|---|---|"]
          for model, path in (("HRRR", "hrrr_status.json"), ("RRFS", "rrfs_status.json")):
              try:
                  d = json.loads(Path(path).read_text())
                  progress = f"{d.get('hours', '?')}/{d.get('expected_hours', '?')} ({d.get('percent_complete', '?')}%)"
                  errors = "; ".join(str(x) for x in d.get("errors", [])[:2]) or "None"
                  errors = errors.replace("|", "/").replace("\\n", " ")[:250]
                  lines.append(f"| {model} | {d.get('cycle', '?')} | {d.get('updated', '?')} | {progress} | {errors} |")
              except Exception as exc:
                  lines.append(f"| {model} | — | — | — | Status unreadable: {str(exc)[:100]} |")
          summary = "\\n".join(lines) + "\\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary)
          PYSUM
      - name: Check published forecast freshness
        if: always()
        run: |
          python - <<'PYHEALTH'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          now = datetime.now(timezone.utc)
          models = {}
          for model in ('hrrr', 'rrfs'):
              try:
                  d = json.loads(Path(model + '_status.json').read_text())
                  updated = datetime.fromisoformat(d['updated'].replace('Z', '+00:00'))
                  age = round((now - updated).total_seconds() / 60, 1)
                  hours = int(d.get('hours', 0))
                  models[model] = {'cycle': d.get('cycle'), 'updated': d['updated'],
                                   'age_minutes': age, 'hours': hours,
                                   'expected_hours': d.get('expected_hours'),
                                   'percent_complete': d.get('percent_complete'),
                                   'state': ('stale' if not (-5 <= age <= 90 and hours) else
                                             'current' if d.get('complete') else 'partial'),
                                   'complete': bool(d.get('complete')),
                                   'errors': d.get('errors', [])[:3]}
              except Exception as e:
                  models[model] = {'state': 'missing', 'error': str(e)[:160]}
          result = {'checked_at': now.isoformat(),
                    'overall': ('current' if all(v['state'] == 'current' for v in models.values()) else
                                'partial' if all(v['state'] in ('current', 'partial') for v in models.values()) else 'degraded'),
                    'models': models}
          Path('forecast_health.json').write_text(json.dumps(result, indent=2) + chr(10))
          print(json.dumps(result, indent=2))
          PYHEALTH
      - name: Install dashboard freshness banner
        run: python scripts/install_health_banner.py
      - name: Validate generated dashboard JavaScript and model updater syntax
        run: |
          python -m py_compile scripts/update_hrrr.py scripts/update_rrfs.py scripts/install_health_banner.py
          python - <<'PYJS'
          import re
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          match=re.search(r'<script id="cu-forecast-health-monitor">(.*?)</script>',html,re.S)
          if not match: raise SystemExit('ERROR: forecast monitor script missing from generated dashboard')
          Path('/tmp/cu-forecast-monitor.js').write_text(match.group(1),encoding='utf-8')
          print('Extracted generated forecast monitor for JavaScript validation')
          PYJS
          node --check /tmp/cu-forecast-monitor.js
      - name: Commit published model data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in reflectivity.json reflectivity_status.json hrrr_wind.json hrrr_pending.json hrrr_reflectivity_pending.json hrrr_status.json hrrr_lightning.json hrrr_lightning_extended.json rrfs_wind.json rrfs_pending.json rrfs_status.json rrfs_lightning.json forecast_health.json model_winds.json index.html; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Update NOAA GFS and HRRR numerical forecasts'
            git push
          fi
