name: NOAA Reflectivity and HRRR Wind Update
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: cu-noaa-forecast
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GRIB decoder and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev
          python -m pip install requests numpy eccodes
      - name: Refresh GFS every 3 hours (retain previous output on failure)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          if [ $((10#$(date -u +%H) % 3)) -eq 0 ]; then python scripts/update_reflectivity.py; else echo "GFS skipped (3-hour cadence)"; fi
      - name: Refresh HRRR hourly
        run: python scripts/update_hrrr.py
      - name: Validate combined numerical reflectivity
        run: |
          python - <<'PYVALID'
          import json
          from pathlib import Path
          rows=json.loads(Path('reflectivity.json').read_text())
          counts={m:sum(r.get('model')==m for r in rows) for m in ('gfs','hrrr')}
          for model in ('gfs','hrrr'):
              if counts[model] < 8:
                  raise SystemExit(f'FAIL: {model} has only {counts[model]} records')
              for r in (r for r in rows if r.get('model')==model):
                  if not isinstance(r.get('zones'),dict) or not isinstance(r.get('peak'),dict):
                      raise SystemExit(f'FAIL: missing geographic fields: {model} {r.get("time")}')
          print('Validated combined reflectivity:',counts)
          PYVALID
      - name: Commit published model data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in reflectivity.json reflectivity_status.json hrrr_wind.json hrrr_status.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Update NOAA GFS and HRRR numerical forecasts'
            git push
          fi
